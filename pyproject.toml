[project]
name = "portfolio"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.149.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "markdown>=3.11.2",
    "pydantic-settings>=2.16.0",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "qdrant-client~=1.13.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
