<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ profile.name }}{% endblock %}</title>
  <meta name="description" content="{{ profile.name }}, {{ profile.headline }}">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
  <link rel="stylesheet" href="{{ url('static/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url('') }}">{{ profile.name }}</a>
      <nav aria-label="Main">
        <ul class="nav">
          {% for href, key, label in nav %}
          <li><a href="{{ url(href) }}"{% if active == key %} aria-current="page"{% endif %}>{{ label }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>{{ profile.name }}, {{ profile.location }}</p>
      <p>
        <a href="mailto:{{ profile.email }}">Email</a>
        <a href="https://{{ profile.linkedin }}" rel="noopener">LinkedIn</a>
        <a href="https://{{ profile.github }}" rel="noopener">GitHub</a>
      </p>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
